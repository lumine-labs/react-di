name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run typecheck:tests
            - run: npm run test
            - run: npm run build
            # Typechecks the built dist/*.d.ts from two throwaway consumer projects
            # (@types/react 18 + bundler, @types/react 19 + NodeNext). Must follow build.
            - run: npm run typecheck:consumers
